
name: Atualizar biblioteca de artes

on:
  push:
    branches:
      - main
    paths:
      - 'src/assets/resources/original/**'
      - 'src/assets/resources/masks/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/atualizar-artes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Processar imagens e gerar site
        run: npm run build

      - name: Salvar biblioteca atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          git add src/assets/resources/maskData.js
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar biblioteca automaticamente"
            git push
          fi
